<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫画详情 · webnovel_rules</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
/* ── 详情页规格：卡片式+模块化，色彩区分功能 ── */
.detail-wrap { max-width: 860px; margin: 0 auto; }
/* 1. 顶部导航栏 */
.manga-topbar { display:flex; align-items:center; gap:10px; padding:10px 4px; }
.manga-topbar .back { font-size:1.3rem; cursor:pointer; background:none; border:none; color:var(--text); padding:6px 10px; border-radius:8px; }
.manga-topbar .back:hover { background:var(--bg-2); }
.manga-topbar .sp { flex:1; }
.manga-topbar .more { background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer; padding:6px 10px; border-radius:8px; }
.manga-topbar .more:hover { background:var(--bg-2); }
/* 2. 封面与标题区 */
.manga-head { display:flex; gap:16px; padding:8px 4px 16px; }
.manga-head .cover { width:130px; height:180px; border-radius:10px; object-fit:cover; box-shadow:0 4px 14px rgba(0,0,0,.4); cursor:pointer; flex-shrink:0; background:#0d1117; }
.manga-head .hi { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
.manga-head .title { font-size:1.15rem; font-weight:700; line-height:1.4; }
.manga-head .sub { font-size:.8rem; color:var(--text-dim); }
/* 3. 操作按钮区（橙/红/紫/绿） */
.ops-row { display:flex; gap:10px; padding:4px 0 10px; flex-wrap:wrap; }
.op-btn { display:flex; align-items:center; gap:6px; padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-size:.9rem; font-weight:600; color:#fff; transition:.15s; }
.op-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
.op-read { background:#e8833a; }
.op-like { background:#e0526e; }
.op-fav  { background:#8b5cf6; }
.op-cmt  { background:#34a853; }
/* 4. 功能按钮区（下载/继续阅读） */
.fn-row { display:flex; gap:10px; padding:0 0 12px; flex-wrap:wrap; }
.fn-btn { flex:1; min-width:130px; display:flex; align-items:center; justify-content:center; gap:6px; padding:11px; border-radius:10px; border:none; cursor:pointer; font-size:.92rem; font-weight:600; color:#fff; transition:.15s; }
.fn-btn:hover { filter:brightness(1.08); }
.fn-download { background:#9b7bd6; }
.fn-continue { background:#2b4d8f; }
/* 5. 阅读进度提示 */
.history-tip { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--bg-2,#1c2230); border-radius:8px; color:var(--text-dim); font-size:.85rem; margin-bottom:14px; }
/* 6. 信息区（标签+内容框） */
.info-sec { background:var(--bg-2,#1c2230); border-radius:12px; padding:14px; margin-bottom:16px; }
.info-sec .sec-title { font-size:.95rem; font-weight:700; margin-bottom:10px; }
.info-item { display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; flex-wrap:wrap; }
.info-label { padding:3px 10px; border-radius:8px; font-size:.75rem; color:#fff; flex-shrink:0; }
.lbl-author { background:#3b82f6; }
.lbl-tag    { background:#0891b2; }
.lbl-views  { background:#ec4899; }
.lbl-time   { background:#ec4899; }
.info-val { padding:3px 12px; background:#2a3140; border-radius:8px; font-size:.82rem; }
.info-val.clickable { cursor:pointer; }
.info-val.clickable:hover { background:#384159; }
/* 7. 章节列表区 */
.chap-sec { background:var(--bg-2,#1c2230); border-radius:12px; padding:14px; }
.chap-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.chap-head .sec-title { font-size:.95rem; font-weight:700; }
.batch-dl { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:.8rem; display:flex; align-items:center; gap:4px; }
.batch-dl:hover { color:var(--accent); }
.chap-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; max-height:420px; overflow-y:auto; }
.chap-item { padding:8px 12px; background:#2a3140; border-radius:8px; cursor:pointer; font-size:.82rem; transition:.12s; text-align:left; border:none; color:var(--text); }
.chap-item:hover { background:var(--accent); color:#0d1117; }
.chap-item .grp { font-size:.68rem; color:var(--text-dim); display:block; }
.chap-item:hover .grp { color:#333; }
/* 已读章节置灰（对齐 Kotatsu：已读降透明度） */
.chap-item.read { opacity:.45; }
.chap-item.read::after { content:' ✓'; font-size:.68rem; color:var(--text-dim); }
/* 已下载章节标记（绿色 ⬇） */
.chap-item.dl { border-left:3px solid #34a853; }
.chap-item.dl .dl-tag { float:right; color:#34a853; font-size:.75rem; }
/* 全屏封面查看 */
.cover-overlay { position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; z-index:99; cursor:zoom-out; }
.cover-overlay img { max-width:92vw; max-height:92vh; border-radius:8px; }
/* ── 加载进度条动画 ── */
.loading-bar-wrap { position:fixed; top:0; left:0; right:0; height:4px; z-index:1000; display:none; box-shadow:0 1px 6px rgba(139,92,246,.4); }
.loading-bar-wrap.show { display:block; }
.loading-bar { height:100%; width:35%; background:linear-gradient(90deg, transparent, #8b5cf6, #34a853, #e8833a, transparent);
  background-size:200% 100%; animation: loadslide 1.1s linear infinite; border-radius:2px; }
@keyframes loadslide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
.loading-hint { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.78); color:#fff;
  padding:6px 16px; border-radius:20px; font-size:.8rem; z-index:1001; display:none; }
.loading-hint.show { display:block; }
/* 画面中间加载层：环形动画 + 百分比 */
.mid-loading { position:fixed; inset:0; background:rgba(10,14,20,.85); display:none; flex-direction:column;
  align-items:center; justify-content:center; z-index:2000; gap:16px; }
.mid-loading.show { display:flex; }
.mid-loading .ring { width:72px; height:72px; border-radius:50%; border:5px solid rgba(139,92,246,.22); border-top-color:#8b5cf6;
  animation:midspin 1s linear infinite; }
.mid-loading .pct { font-size:1.4rem; font-weight:700; color:#fff; letter-spacing:1px; }
.mid-loading .hint { color:var(--text-dim); font-size:.88rem; }
@keyframes midspin { to { transform:rotate(360deg); } }
.loading-fade { opacity:.5; transition:opacity .2s; pointer-events:none; }

/* ═══ R3 信息架构优化（Kimi 协作）═══ */
/* 主操作按钮：双列网格，拇指友好 */
.fn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:4px 0 10px; }
.fn-btn { min-height:46px; font-size:.95rem; border-radius:12px; }
.fn-continue { background:var(--accent); color:#1a1400; box-shadow:0 2px 10px rgba(232,179,75,.25); }
.fn-continue:hover { filter:brightness(1.08); }
.fn-download { background:#9b7bd6; }
/* 次要操作：紧凑小按钮行 */
.ops-row { gap:8px; }
.op-btn { min-height:36px; padding:8px 14px; font-size:.82rem; border-radius:10px; }
/* 阅读进度提示：accent 边框卡片 */
.history-tip {
  border:1px solid rgba(232,179,75,.35); border-left:3px solid var(--accent);
  background:rgba(232,179,75,.07); color:var(--text); font-weight:500;
  border-radius:10px; padding:10px 14px; margin-bottom:14px;
}
/* 章节列表头 sticky + 分组清晰 */
.chap-head { position:sticky; top:0; background:var(--bg); z-index:5; padding:10px 2px; }
.chap-sec { margin-bottom:16px; }
/* 章节项触控区 */
.chap-item { min-height:42px; display:flex; align-items:center; }
.chap-item.read { color:var(--text-disabled); }
@media (max-width:768px){
  .fn-row { gap:8px; }
  .ops-row { gap:6px; }
  .op-btn { min-height:34px; padding:6px 10px; font-size:.78rem; }
}

</style>
</head>
<body>
<div id="loading-bar-wrap" class="loading-bar-wrap"><div class="loading-bar"></div></div>
<div id="loading-hint" class="loading-hint">⏳ 正在加载漫画详情…</div>
<div id="mid-loading" class="mid-loading">
  <div class="ring"></div>
  <div class="pct" id="mid-pct">0%</div>
  <div class="hint" id="mid-hint">正在加载漫画详情…</div>
</div>
<div class="container">
  <!-- 1. 顶部导航栏（始终可点，不受加载遮罩影响） -->
  <div class="manga-topbar">
    <button class="back" onclick="history.back()">←</button>
    <span id="nav-title" style="font-weight:600;font-size:.95rem;"></span>
    <div class="sp"></div>
    <button class="more" title="更多操作" onclick="showMore()">⋮</button>
  </div>
</div>
<div class="container detail-wrap" id="detail-wrap">
  <!-- 加载骨架屏（数据加载中显示） -->
  <div id="skeleton" style="padding:16px 0;">
    <div style="display:flex;gap:16px;margin-bottom:16px;">
      <div style="width:130px;height:180px;border-radius:10px;background:linear-gradient(90deg,#2a3140 25%,#384159 50%,#2a3140 75%);background-size:200% 100%;animation:skel 1.2s infinite;"></div>
      <div style="flex:1;">
        <div style="height:20px;width:70%;border-radius:6px;background:#2a3140;margin-bottom:10px;"></div>
        <div style="height:14px;width:40%;border-radius:6px;background:#2a3140;margin-bottom:8px;"></div>
        <div style="height:14px;width:90%;border-radius:6px;background:#2a3140;"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <div style="height:40px;flex:1;border-radius:10px;background:#2a3140;"></div>
      <div style="height:40px;flex:1;border-radius:10px;background:#2a3140;"></div>
    </div>
    <div style="height:120px;border-radius:12px;background:#2a3140;margin-bottom:16px;"></div>
    <div style="height:200px;border-radius:12px;background:#2a3140;"></div>
  </div>
  <style>@keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }</style>
  <!-- 2. 封面与标题区 -->
  <div class="manga-head">
    <img id="cover" class="cover" alt="cover" loading="lazy" decoding="async" onclick="viewCover()">
    <div class="hi">
      <div id="title" class="title"></div>
      <div id="subtitle" class="sub"></div>
      <div id="desc" style="font-size:.8rem;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;"></div>
      <div id="few-chapters-warning" style="display:none;margin-top:8px;font-size:.78rem;color:#ff9d5c;background:rgba(255,157,92,.1);border:1px solid rgba(255,157,92,.3);border-radius:8px;padding:8px 10px;line-height:1.5;"></div>
    </div>
  </div>

  <!-- 3. 操作按钮区（橙/红/紫/绿） -->
  <div class="ops-row">
    <button class="op-btn op-read" onclick="startRead()">▶ 开始</button>
    <button class="op-btn op-like" id="like-btn">♥ <span id="like-num"></span></button>
    <button class="op-btn op-fav" onclick="toggleFav()">🔖 收藏</button>
    <button class="op-btn op-cmt" onclick="toast('评论功能开发中')">💬 评</button>
  </div>

  <!-- 4. 功能按钮区（下载/继续阅读） -->
  <div class="fn-row">
    <button class="fn-btn fn-download" id="dl-btn" onclick="downloadAll()">⭳ 下载</button>
    <button class="fn-btn fn-continue" id="continue-btn" onclick="continueRead()">▶ 继续</button>
  </div>

  <!-- 5. 阅读进度提示 -->
  <div class="history-tip" id="history-tip" style="display:none;">
    🕐 上次阅读: <span id="history-pos"></span>
  </div>

  <!-- 6. 漫画信息区（作者/标签/浏览量/更新时间） -->
  <div class="info-sec">
    <div class="sec-title">信息</div>
    <div id="info-author" class="info-item"></div>
    <div id="info-tags" class="info-item"></div>
    <div id="info-views" class="info-item"></div>
    <div id="info-time" class="info-item"></div>
  </div>

  <!-- 7. 章节列表区 -->
  <div class="chap-sec">
    <div class="chap-head">
      <div class="sec-title">章节 <span id="chap-count" style="font-weight:400;color:var(--text-dim);font-size:.8rem;"></span></div>
      <button class="batch-dl" onclick="downloadAll()">⭳ 批量下载</button>
    </div>
    <div class="chap-list" id="chapters"></div>
  </div>
</div>
<div id="cover-overlay" class="cover-overlay" style="display:none;" onclick="this.style.display='none'"></div>

<script src="/static/js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const SOURCE = params.get('source');
// B2: 畸形 % 序列会让 decodeURIComponent 抛 URIError 毁掉整段脚本；
// 参数缺失时 decodeURIComponent(null) 得到字符串 "null" 继续发请求——统一拦截
let CID = '';
try { CID = decodeURIComponent(params.get('id') || ''); } catch (e) { CID = ''; }
const chapters = [];
let detail = null;

let loadingTimer = null;
function setLoading(on) {
  clearInterval(loadingTimer);
  document.getElementById('loading-bar-wrap').classList.toggle('show', on);
  document.getElementById('loading-hint').classList.toggle('show', on);
  const mid = document.getElementById('mid-loading');
  const wrap = document.getElementById('detail-wrap');
  const sk = document.getElementById('skeleton');
  if (sk) sk.style.display = on ? '' : 'none';
  if (on) {
    mid.classList.add('show');
    let pct = 3;
    document.getElementById('mid-pct').textContent = pct + '%';
    document.getElementById('mid-hint').textContent = '正在加载漫画详情…';
    // 模拟递增进度（真实 fetch 完成后跳到 100%）
    loadingTimer = setInterval(() => {
      pct = Math.min(92, pct + Math.max(1, Math.round((92 - pct) * 0.08)));
      document.getElementById('mid-pct').textContent = pct + '%';
    }, 300);
  } else {
    mid.classList.remove('show');
    document.getElementById('mid-pct').textContent = '100%';
    if (wrap) wrap.classList.remove('loading-fade');
  }
  if (wrap) wrap.classList.toggle('loading-fade', on);
}
async function load() {
  setLoading(true);
  // 自动重试（最多 3 次）：拷贝漫画等源间歇性风控时提升成功率
  let lastErr = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      // fetch 超时兜底（60s/次）：避免进度条永久卡住
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      let r;
      try {
        r = await fetch('/api/manga/' + SOURCE + '/' + encodeURIComponent(CID), {signal: ctrl.signal});
      } finally { clearTimeout(timer); }
      const st = r.status;
      detail = await r.json();
      if (detail.error) throw new Error((st === 404 ? '404 ' : '') + detail.error);
    document.title = detail.title + ' · 漫画详情';
    $('#nav-title').textContent = detail.title;
    $('#title').textContent = detail.title;
    $('#subtitle').textContent = detail.sub_title || '';
    // R25: 少章节告警（包子《迷宫饭》简版仅 1 话等）——提示找更完整版本
    const warnEl = document.getElementById('few-chapters-warning');
    if (warnEl) {
      if (detail.warning) {
        warnEl.textContent = detail.warning;
        warnEl.style.display = 'block';
      } else {
        warnEl.style.display = 'none';
      }
    }
    $('#desc').textContent = detail.description || '';
    const cover = $('#cover');
    cover.src = detail.cover || '';
    cover.onerror = () => { cover.style.display = 'none'; };
    $('#like-num').textContent = detail.likes || '';
    $('#like-btn').style.display = detail.likes ? '' : 'none';
    // 信息区
    $('#info-author').innerHTML = `<span class="info-label lbl-author">作者</span><span class="info-val">${esc(detail.author || '未知')}</span>`;
    const tags = (detail.tags || []).map(t => `<span class="info-val clickable" data-tag="${esc(t)}">${esc(t)}</span>`).join('');
    $('#info-tags').innerHTML = `<span class="info-label lbl-tag">标签</span>${tags || '<span class="info-val">无</span>'}`;
    // B1: 不再用 onclick 内联拼接（esc 的 &#39; 会被 HTML 解码回 ' 导致转义失效），
    // 改 data-tag + 事件绑定，dataset 读出的是未转义原值，searchTag 内自行 encodeURIComponent
    $('#info-tags').querySelectorAll('.info-val.clickable').forEach(el =>
      el.addEventListener('click', () => searchTag(el.dataset.tag)));
    $('#info-views').innerHTML = `<span class="info-label lbl-views">浏览量</span><span class="info-val">${esc(detail.views || '')}</span>`;
    $('#info-time').innerHTML = `<span class="info-label lbl-time">更新时间</span><span class="info-val">${esc(detail.update_time || '')}</span>`;
    // 章节（话）
    const chs = detail.chapters || [];
    const vols = detail.volumes || [];
    const downloaded = new Set(detail.downloaded || []);
    const dlCount = chs.filter(c => downloaded.has(c.id)).length;
    $('#chap-count').textContent = '共 ' + chs.length + ' 话'
      + (dlCount ? ' · ⬇' + dlCount + ' 已下载' : '')
      + (vols.length ? ' · ' + vols.length + ' 卷' : '');
    // R49k: 已下载章节完整性提示(检查更新/下载后产生) + 一键修复
    const ig = detail.integrity || null;
    if (ig) {
      let igHtml = '';
      const inc = ig.incomplete || [];
      if (ig.status === 'running') {
        igHtml = '<div class="ig-note" style="margin:8px 0;padding:8px 10px;border-radius:8px;background:rgba(139,92,246,.08);color:var(--accent-2);font-size:.8rem;">🔍 正在校验已下载章节完整性…' + (ig.progress ? ' <span style="color:var(--text-dim)">' + esc(ig.progress) + '</span>' : '') + '</div>';
      } else if (inc.length) {
        igHtml = '<div class="ig-note" style="margin:8px 0;padding:8px 10px;border-radius:8px;background:rgba(232,179,75,.1);border:1px solid rgba(232,179,75,.35);font-size:.8rem;">⚠️ <b>' + inc.length + ' 话下载不全</b>：' +
          inc.slice(0, 6).map(x => esc(x.name) + ' <span style="color:var(--text-dim)">' + (x.have||0) + '/' + (x.total||'?') + '</span>').join('、') +
          (inc.length > 6 ? ' 等' : '') +
          ' <button id="ig-fix" style="margin-left:8px;padding:3px 10px;border-radius:6px;border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer;">修复全部</button></div>';
      }
      if (igHtml) {
        const igd = document.createElement('div');
        igd.innerHTML = igHtml;
        const _box = $('#chapters');
        _box.insertAdjacentElement('beforebegin', igd);
        const fixBtn = igd.querySelector('#ig-fix');
        if (fixBtn) {
          fixBtn.onclick = async () => {
            fixBtn.disabled = true; fixBtn.textContent = '修复中…';
            let okc = 0, erc = 0;
            for (const x of inc) {
              try {
                const rr = await fetch(`/api/manga/${SOURCE}/${encodeURIComponent(CID)}/chapter/${encodeURIComponent(x.id)}/repair`,
                  {method:'POST', headers:{'Content-Type':'application/json'}, body: '{}'});
                const dd = await rr.json();
                if (dd.ok && dd.fixed > 0) okc++; else erc++;
              } catch (e) { erc++; }
            }
            fixBtn.textContent = '修复完成：补全 ' + okc + ' 话' + (erc ? '，失败 ' + erc : '');
            setTimeout(() => location.reload(), 1200);
          };
        }
      }
    }
    const box = $('#chapters');
    box.innerHTML = '';
    let curGroup = '';
    chs.forEach((c, i) => {
      chapters.push(c);
      const btn = document.createElement('button');
      btn.className = 'chap-item' + (downloaded.has(c.id) ? ' dl' : '');
      const grpLabel = c.group && c.group !== curGroup ? `<span class="grp">${esc(c.group)}</span>` : '';
      if (c.group) curGroup = c.group;
      btn.innerHTML = grpLabel + esc(c.name || ('第' + (i+1) + '话'))
        + (downloaded.has(c.id) ? '<span class="dl-tag">⬇</span>' : '');
      btn.onclick = () => openReader(i);
      box.appendChild(btn);
    });
    // 卷：单独分组列表（单行本/整卷合集标记，不参与话的阅读序列）
    if (vols.length) {
      const vs = document.createElement('div');
      vs.style.cssText = 'margin-top:14px;';
      vs.innerHTML = `<div style="font-weight:700;margin-bottom:8px;color:var(--text);">📦 单行本/卷 <span style="font-weight:400;color:var(--text-dim);font-size:.75rem;">${vols.length} 卷（整卷合集，不占话序号）</span></div>`;
      const vgrid = document.createElement('div');
      vgrid.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;';
      vols.forEach((v, i) => {
        const vb = document.createElement('span');
        vb.style.cssText = 'background:#262d3a;border:1px solid var(--border);border-radius:8px;font-size:.78rem;color:var(--text-dim);padding:5px 10px;display:inline-block;';
        vb.textContent = (v.name || ('第' + (i+1) + '卷'));
        vgrid.appendChild(vb);
      });
      vs.appendChild(vgrid);
      box.parentNode.insertBefore(vs, box.nextSibling);
    }
    // 推荐漫画
    if (detail.recommend && detail.recommend.length) {
      const rc = document.createElement('div');
      rc.className = 'info-sec';
      rc.innerHTML = '<div class="sec-title">相关推荐</div>';
      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;';
      detail.recommend.forEach(r => {
        const it = document.createElement('div');
        it.style.cssText = 'cursor:pointer;text-align:center;';
        it.innerHTML = `<img src="${esc(r.cover||'')}" loading="lazy" decoding="async" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#0d1117;" onerror="this.style.display='none'"><div style="font-size:.68rem;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(r.title)}</div>`;
        it.onclick = () => {
          if (!SOURCE || !r.id) { alert('推荐项缺少源信息'); return; }
          location.href = '/manga_detail?source=' + SOURCE + '&id=' + encodeURIComponent(r.id);
        };
        grid.appendChild(it);
      });
      rc.appendChild(grid);
      document.querySelector('.chap-sec').insertAdjacentElement('beforebegin', rc);
    }
    // 历史（服务端持久化）→ 继续阅读 + 已读章节置灰（对齐 Kotatsu）
    try {
      const hr = await fetch('/api/manga/history');
      const hd = await hr.json();
      const hh = (hd.history||[]).find(x => x.source === SOURCE && x.comic_id === CID);
      if (hh) {
        $('#history-tip').style.display = 'flex';
        const _rs = detail && detail.resume;
        $('#history-pos').textContent = (hh.pos || '')
          + (_rs && _rs.matched_label ? ' → 打开「' + _rs.matched_label + '」' : '')
          + (_rs && _rs.note ? '（' + _rs.note + '）' : '');
        $('#continue-btn').textContent = '▶ 继续';
      } else {
        $('#continue-btn').textContent = '▶ 从头开始';
      }
      // 已读章节置灰：历史记录中该漫画的所有 idx
      const readIdx = new Set((hd.history||[])
        .filter(x => x.source === SOURCE && x.comic_id === CID)
        .map(x => x.idx));
      box.querySelectorAll('.chap-item').forEach((b, i) => {
        if (readIdx.has(i)) b.classList.add('read');
      });
    } catch(e){}
      setLoading(false);
      loadFavState();
      return;  // 成功
    } catch (e) {
      lastErr = e;
      if (attempt < 3) {
        // 下次重试前稍等（指数退避）
        await new Promise(res => setTimeout(res, 2000 * attempt));
      }
    }
  }
  // 全部重试失败
  setLoading(false);
  const is404 = lastErr && /404|下架|不存在/.test(lastErr.message || '');
  document.body.insertAdjacentHTML('afterbegin', `<div style="padding:20px;color:#f66;background:rgba(255,80,80,.1);border-bottom:1px solid rgba(255,80,80,.3);">
    ⚠️ ${is404 ? '漫画不存在或已下架' : '详情加载失败'}${lastErr && lastErr.name === 'AbortError' ? '（请求超时）' : ''}: ${esc(lastErr ? lastErr.message : '未知')}<br>
    <small>${is404
      ? '该漫画在所选源中已下架。可 <a href="javascript:history.back()" style="color:#8ab4ff;">返回搜索</a> 或切换其他源。'
      : '该源可能正在风控/限流。可 <a href="javascript:location.reload()" style="color:#8ab4ff;">重试</a>，或稍后再试（已成功的详情会缓存，下次秒开）。'}</small></div>`);
}
function viewCover() {
  const o = $('#cover-overlay');
  o.innerHTML = `<img src="${esc(detail.cover)}">`;
  o.style.display = 'flex';
}
function startRead() { openReader(0); }
async function continueRead() {
  let idx = 0, pg = 0;
  // 0.64.0：**优先用服务端解析出的落点**（detail.resume）。服务端按"章节 id →
  // 章名 → 话号"在当前目录里定位上次读到的那一话；直接用历史里的 idx 会在
  // 目录变化后落到别的一话（实测：记录 idx=55 而当前目录只剩 54 章 → 旧逻辑
  // 直接跳到第 1 话）。
  const res = detail && detail.resume;
  if (res && typeof res.index === 'number' && res.index >= 0) {
    idx = res.index;
    if (res.page > 1) pg = res.page;
    openReader(idx, pg);
    return;
  }
  try {
    const r = await fetch('/api/manga/history');
    const d = await r.json();
    const hh = (d.history||[]).find(x => x.source === SOURCE && x.comic_id === CID);
    if (hh) {
      idx = hh.idx || 0;
      // 解析进度里的页码（pos 形如 "第3话 P12"）
      const m = (hh.pos || '').match(/P(\d+)$/i);
      if (m) pg = parseInt(m[1], 10) || 0;
    }
  } catch(e){}
  openReader(idx, pg);
}
function openReader(idx, pg) {
  location.href = '/manga_reader?source=' + SOURCE + '&cid=' + encodeURIComponent(CID)
    + '&ch=' + idx + '&title=' + encodeURIComponent(detail.title)
    + (pg > 1 ? '&pg=' + pg : '');
}
async function toggleFav() {
  const btn = document.querySelector('.op-fav');
  const isFav = btn.dataset.fav === '1';
  try {
    if (isFav) {
      await requestJSON('/api/manga/favorites/' + encodeURIComponent(SOURCE) + '/' + encodeURIComponent(CID),
        {method: 'DELETE', button: btn});
      btn.dataset.fav = '0';
      btn.style.opacity = '.6';
      btn.innerHTML = '🔖 收藏';
      alert('已取消收藏');
    } else {
      await requestJSON('/api/manga/favorites', {method: 'POST', button: btn,
        body: {source: SOURCE, comic_id: CID, title: detail.title, cover: detail.cover}});
      btn.dataset.fav = '1';
      btn.style.opacity = '1';
      btn.innerHTML = '🔖 已收藏';
      alert('已加入收藏');
    }
  } catch (e) {
    // 非 2xx / 业务失败：不改动收藏态 UI，如实提示（不再假成功）
    alert('收藏操作失败：' + ((e && e.message) || e));
  }
}
async function loadFavState() {
  try {
    const r = await fetch('/api/manga/favorites');
    const d = await r.json();
    const isFav = (d.favorites||[]).some(f => f.source === SOURCE && f.comic_id === CID);
    const btn = document.querySelector('.op-fav');
    btn.dataset.fav = isFav ? '1' : '0';
    btn.style.opacity = isFav ? '1' : '.6';
    btn.innerHTML = isFav ? '🔖 已收藏' : '🔖 收藏';
  } catch(e){}
}
function showMore() {
  const menu = ['复制标题', '复制链接'];
  const pick = prompt('更多操作：\n1. 复制标题\n2. 复制链接');
  if (pick === '1') { navigator.clipboard.writeText(detail.title); alert('已复制'); }
  if (pick === '2') { navigator.clipboard.writeText(location.href); alert('已复制'); }
}
function searchTag(t) { location.href = '/manga?q=' + encodeURIComponent(t); }
function downloadAll() {
  if (!chapters.length) return;
  if (!confirm('下载全部 ' + chapters.length + ' 话？')) return;
  location.href = '/manga_download?source=' + SOURCE + '&cid=' + encodeURIComponent(CID)
    + '&title=' + encodeURIComponent(detail.title);
}
if (!SOURCE || !CID) {
  // 参数缺失/解码失败：不发请求，直接提示
  const sk = document.getElementById('skeleton');
  if (sk) sk.style.display = 'none';
  document.body.insertAdjacentHTML('afterbegin', '<div style="padding:20px;color:#f66;background:rgba(255,80,80,.1);border-bottom:1px solid rgba(255,80,80,.3);">⚠️ 链接参数缺失或无效（source/id）。请 <a href="javascript:history.back()" style="color:#8ab4ff;">返回</a> 重新进入。</div>');
} else {
  load();
}
</script>
