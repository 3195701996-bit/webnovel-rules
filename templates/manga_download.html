<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫画下载 · webnovel_rules</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/style.css">
<style>
.dl-card { max-width:640px; margin:clamp(16px,5vh,48px) auto; padding:clamp(18px,4vw,28px);
  border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-elevated);
  box-shadow:var(--shadow); }
.dl-title { color:var(--text-primary); font-size:1.12rem; font-weight:700; overflow-wrap:anywhere; }
.dl-progress { margin:18px 0 12px; height:10px; overflow:hidden; border-radius:999px;
  background:var(--bg-hover); border:1px solid color-mix(in srgb,var(--border) 75%,transparent); }
.dl-progress i { display:block; width:0%; height:100%; border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width var(--dur-base) ease; }
.dl-status { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap;
  gap:6px 16px; color:var(--text-secondary); font-size:.86rem; font-variant-numeric:tabular-nums; }
.dl-status #status { color:var(--text-primary); font-weight:600; }
.dl-status #status[data-state="done"] { color:var(--green); }
.dl-status #status[data-state="error"] { color:var(--red); }
.dl-status #status[data-state="running"] { color:var(--accent-2); }
.dl-current { min-height:1.5em; margin-top:10px; color:var(--text-secondary); font-size:.86rem;
  line-height:1.55; overflow-wrap:anywhere; }
.dl-inline-action { color:var(--accent-2); text-decoration:underline; text-underline-offset:2px; }
.dl-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
.dl-actions .btn { min-width:132px; min-height:44px; }
.dl-actions .btn:disabled { opacity:.55; cursor:not-allowed; }
@media (max-width:520px) {
  .dl-card { margin:12px auto; }
  .dl-actions .btn { flex:1 1 calc(50% - 5px); min-width:0; }
}
</style>
</head>
<body>
<header class="topbar">
  <span class="logo">📚 webnovel_rules<small>发现 · 收藏 · 阅读</small></span>
  <nav>
    <a href="/">🔍 发现</a>
    <a href="/library">📖 书架</a>
    <a href="/tasks_page">⬇ 下载</a>
    <a href="/manga" class="active">🎨 漫画</a>
  </nav>
</header>
<div class="container">
  <div class="dl-card">
    <div id="title" class="dl-title"></div>
    <div id="download-progress" class="dl-progress" role="progressbar" aria-label="漫画下载进度"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
      <i id="bar"></i>
    </div>
    <div class="dl-status" aria-live="polite">
      <span id="status" role="status" aria-live="polite">准备中…</span>
      <span id="progress">0/0</span>
    </div>
    <div class="dl-current" id="current" role="status" aria-live="polite"></div>
    <div class="dl-actions">
      <button class="btn primary" id="start-btn" onclick="startDl()">开始下载</button>
      <button class="btn" id="zip-btn" onclick="downloadZip()" disabled>打包 ZIP</button>
    </div>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const SOURCE = params.get('source');
// URLSearchParams.get() 已完成一次 URL 解码；不要再次 decodeURIComponent，
// 否则标题中的字面百分号会使所有参数一起失效，ID 中的 %2F 也会被改写。
const CID = params.get('cid') || '';
const TITLE = params.get('title') || '';
const COVER = params.get('cover') || '';
const CH_NAME = params.get('ch') || '';
const CH_ID = params.get('chid') || '';
const MODE = params.get('mode') || '';
const VISIBLE_SELECTION = params.get('selection') === 'visible';
const SELECTION_KEY = 'manga_download_selection_v1:' + SOURCE + ':' + CID;
let VISIBLE_CHAPTER_IDS = [];
if (VISIBLE_SELECTION) {
  try {
    const stored = JSON.parse(sessionStorage.getItem(SELECTION_KEY) || 'null');
    if (Array.isArray(stored)) VISIBLE_CHAPTER_IDS = [...new Set(stored
      .filter(id => typeof id === 'string' && id.length > 0 && id.length <= 512))];
  } catch (e) {}
}
document.title = TITLE + ' · 下载';
$('#title').textContent = TITLE;
// B03: 轮询器句柄（createPoller，common.js）——替代裸 setInterval；
// pollerStopped 记录终态 stop（stop 后 kick 无效，续传重启须重建轮询器）
let poller = null, pollerStopped = false;
let autoFavoriteWarning = '';
if (!SOURCE || !CID) {
  // 参数缺失/解码失败：禁用下载入口，不发请求
  $('#status').textContent = '⚠️ 链接参数缺失或无效（source/cid），无法下载';
  $('#status').dataset.state = 'error';
  $('#start-btn').disabled = true;
}

async function startDl() {
  const btn = $('#start-btn');
  btn.disabled = true;
  let chapters = [];
  if (MODE === 'single') {
    if (CH_ID) {
      // A02: 入口已传稳定 chapter_id——只提交该 ID，不再按名称定位
      chapters = [CH_ID];
    } else if (CH_NAME) {
      // 兼容旧链接：无 chid 时按名称定位该话 id
      // C01: 定位请求失败（断网/错误页）也走"未找到"分支——停止提交并可重试，
      // 绝不把请求失败静默吞掉后扩大为整本下载
      try {
        const d = await requestJSON(`/api/manga/${SOURCE}/${encodeURIComponent(CID)}`);
        const hit = (d.chapters || []).find(c =>
          c.name === CH_NAME || c.name.includes(CH_NAME) || CH_NAME.includes(c.name));
        if (hit) chapters = [hit.id];
      } catch (e) {}
    }
    if (!chapters.length) {
      // A02: 定位失败就停止提交——绝不擅自扩大为整本下载；
      // 提供重试（重新定位）或返回目录，整本下载由用户另行选择
      $('#status').textContent = '⚠️ 未找到该话，已取消提交（不会自动下载整本）';
      $('#status').dataset.state = 'error';
      $('#current').innerHTML = '<a class="dl-inline-action" href="javascript:void(0)" onclick="startDl()">重试</a>'
        + ' · <a class="dl-inline-action" href="javascript:history.back()">返回目录</a>';
      btn.disabled = false;
      return;
    }
  } else if (VISIBLE_SELECTION) {
    chapters = VISIBLE_CHAPTER_IDS.slice();
    if (!chapters.length) {
      $('#status').textContent = '⚠️ 当前目录选区已丢失，已取消（不会下载整本）';
      $('#status').dataset.state = 'error';
      $('#current').innerHTML = '<a class="dl-inline-action" href="javascript:history.back()">返回目录重试</a>';
      btn.disabled = false;
      return;
    }
  }
  // C01: POST 失败（断网/HTML 错误页/服务端拒绝）显示可恢复错误并恢复按钮，
  // 不假成功、不自动重试提交；成功后只提示"请求已接受"，终态以轮询确认为准
  let d;
  try {
    d = await requestJSON(`/api/manga/${SOURCE}/${encodeURIComponent(CID)}/download`,
      {method: 'POST', body: {title: TITLE, cover: COVER, chapters: chapters}});
  } catch (e) {
    $('#status').textContent = '⚠️ 下载请求失败: ' + e.message;
    $('#status').dataset.state = 'error';
    $('#current').innerHTML = '<a class="dl-inline-action" href="javascript:void(0)" onclick="startDl()">重试</a>';
    btn.disabled = false;
    return;
  }
  $('#status').textContent = d.status === 'running' ? '请求已接受，下载进行中…' : '请求已接受，等待任务状态…';
  $('#status').dataset.state = d.status === 'running' ? 'running' : 'queued';
  if (d.favorited === false)
    autoFavoriteWarning = d.favorite_warning || '自动收藏失败，请稍后手动收藏';
  pollErrors = 0;
  // B03: 启动/重启轮询——createPoller（common.js）：setTimeout 链（一次请求
  // 完成后才排下一次，状态接口慢于间隔也不叠请求）+ 页面隐藏停轮 +
  // 失败指数退避 + 按状态调速：running 1.5s 高频；queued/cancel 3s；
  // 其余（paused/stopped/idle）10s 低频。createPoller 创建即首刷，替代原
  // 先独立的 poll() 调用；终态 stop 后 kick 无效，续传重启须重建轮询器
  if (!poller || pollerStopped) {
    poller = createPoller(poll, {
      baseMs: 10000,
      interval: (st) => !st ? 10000
        : st.status === 'running' ? 1500
        : (st.status === 'queued' || st.status === 'cancel') ? 3000 : 10000,
    });
    pollerStopped = false;
  } else {
    poller.kick();   // 已在轮询：立即补刷一次并重排计时
  }
}
let pollErrors = 0;
async function poll() {
  // C01: 轮询统一异常恢复——单次失败不清空进度、不假成功、不停轮询；
  // B03: 失败返回 null 交给 createPoller 指数退避（连续失败间隔自动拉长，
  // 封顶 60s），恢复成功后自动回到按状态调速的正常频率
  let d;
  try {
    d = await requestJSON(`/api/manga/download/status?source=${SOURCE}&cid=${encodeURIComponent(CID)}`);
  } catch (e) {
    pollErrors++;
    $('#status').textContent = '⚠️ 状态获取失败（' + pollErrors + ' 次）: ' + e.message;
    $('#status').dataset.state = 'error';
    if (pollErrors >= 10) {
      // 连续失败：退避已把间隔拉长，给出手动立即重试入口，按钮恢复可用
      $('#status').textContent = '⚠️ 状态持续获取失败，自动刷新已降频退避';
      $('#current').innerHTML = '<a class="dl-inline-action" href="javascript:void(0)" onclick="resumePoll()">立即重试</a>';
      $('#start-btn').disabled = false;
    }
    return null;   // B03: null 视为本次失败 → createPoller 退避
  }
  pollErrors = 0;
  // C06: 状态文案细分——cancel=停止中（worker 收尾）、paused/stopped 可恢复、
  // error 为部分失败可续传
  $('#status').textContent = ({running:'⏳ 下载中…',done:'✅ 完成',error:'⚠️ 部分失败：'+(d.error||'有章节失败')+'（可重新启动续传）',idle:'等待开始',queued:'排队中…',paused:'⏸ 已暂停',stopped:'已停止',cancel:'⏹ 停止中…'}[d.status]||d.status);
  $('#status').dataset.state = d.status;
  // R49h: 图片级进度优先(单张实时); 章级兜底; 附速度与剩余时间
  if (d.images_total) {
    $('#progress').textContent = d.images_done + '/' + d.images_total + ' 张'
      + (d.done ? ' · 第' + d.done + '/' + (d.total||'?') + '章' : '');
    if (d.status === 'running') {
      $('#progress').textContent += d.speed
        ? ' · ' + Number(d.speed).toFixed(1) + '张/s'
        : ' · 速度估算中';
    }
    if (d.eta) $('#progress').textContent += ' · 约' + Math.ceil(d.eta/60) + '分';
  } else {
    $('#progress').textContent = d.done + '/' + (d.total||'?');
  }
  $('#current').textContent = (d.current || '')
    + (typeof autoFavoriteWarning !== 'undefined' && autoFavoriteWarning
      ? ' · ⚠ ' + autoFavoriteWarning : '');
  const denom = d.images_total || d.total;
  const pct = denom ? Math.max(0, Math.min(100,
    Math.round((d.images_total ? d.images_done : d.done)/denom*100))) : 0;
  $('#bar').style.width = pct + '%';
  $('#download-progress').setAttribute('aria-valuenow', String(pct));
  $('#download-progress').setAttribute('aria-valuetext', $('#progress').textContent + '（' + pct + '%）');
  // B03: 终态停止轮询（续传重启时 startDl 重建轮询器）
  // 终态：done 同样恢复开始按钮（否则完成后需刷新页面才能再次续传/重下）
  if (d.status === 'done') { poller.stop(); pollerStopped = true; $('#zip-btn').disabled = false; $('#start-btn').disabled = false; }
  if (d.status === 'error') { poller.stop(); pollerStopped = true; $('#start-btn').disabled = false; }
  return d;   // B03: 返回数据供轮询器按状态调速
}
function resumePoll() {
  // C01: 连续失败后的手动恢复入口——立即重试并重排计时（退避靠下次成功自动复位）
  pollErrors = 0;
  if (poller && !pollerStopped) poller.kick();
  $('#status').textContent = '⏳ 已恢复状态刷新…';
}
function downloadZip() { window.open(`/api/manga/${SOURCE}/${encodeURIComponent(CID)}/zip`, '_blank'); }
</script>
</body>
</html>
