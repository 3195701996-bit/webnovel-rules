name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 核心运行时 + 漫画特性（Pillow/cryptography，测试会 import）+ 开发工具
          pip install -r requirements.txt -r requirements-manga.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app.py server engine tests

      # 注：APK 的 Python 引擎在 Gradle 构建期从本仓库桌面源码生成快照
      # （android/app/build.gradle 的 syncPythonSnapshot 任务），仓库内不再有
      # 需要保持一致的"安卓镜像副本"，因此无需镜像一致性检查。

      - name: Lint (non-blocking style, blocking on real errors)
        run: |
          pip install ruff
          # 只拦真错误：未定义名/重复定义/语法问题；风格问题不阻断
          ruff check . --select E9,F63,F7,F82,F811 \
            --exclude venv,android,opensource

      - name: Run tests
        env:
          WR_TEST: "1"
          WR_DISABLE_BACKGROUND: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests/ -o addopts='' -q -p no:cacheprovider --timeout=120

      - name: API smoke checklist (real server, key endpoints)
        run: python tools/smoke_api.py

      - name: Assert test run left no repo residue
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::测试运行污染了工作树："
            git status --porcelain
            exit 1
          fi
