name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (all sources incl. Android embedded copy)
        run: |
          python -m compileall -q app.py server engine tests
          python -m compileall -q android_app/app/src/main/python

      - name: Assert Android embedded mirror is in sync
        run: |
          # 安卓内嵌镜像（engine/server/app.py/templates/static/sources）由
          # scripts/sync_android.sh 从桌面权威源生成，禁止手改镜像。
          # 此处全量断言一致（__pycache__/.DS_Store 不计）。
          if ! bash scripts/sync_android.sh --check; then
            echo "::error::安卓镜像与桌面权威源不一致，请运行 scripts/sync_android.sh 后再提交"
            exit 1
          fi
          echo "安卓镜像一致 ✓"

      - name: Lint (non-blocking style, blocking on real errors)
        run: |
          pip install ruff
          # 只拦真错误：未定义名/重复定义/语法问题；风格问题不阻断
          ruff check . --select E9,F63,F7,F82,F811 \
            --exclude venv,android_app,opensource

      - name: Run tests
        env:
          WR_TEST: "1"
        run: python -m pytest tests/ -q --timeout=120

      - name: API smoke checklist (real server, key endpoints)
        run: python tools/smoke_api.py

      - name: Assert test run left no repo residue
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::测试运行污染了工作树："
            git status --porcelain
            exit 1
          fi
